[package]
name = "gitpad"
version = "0.6.0"
description = "Cliente Git de escritorio ligero"
authors = ["lurio84"]
license = "MIT"
edition = "2021"

[lib]
name = "gitpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
